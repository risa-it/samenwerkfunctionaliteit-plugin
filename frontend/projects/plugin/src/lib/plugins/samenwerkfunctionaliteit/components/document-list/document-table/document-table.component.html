<cds-table-container>
  <cds-table-toolbar
    [model]="model()"
    [batchText]="batchText"
    [cancelText]="{
      CANCEL: ('samenwerkfunctionaliteit.common.actions.cancel' | translate),
    }"
    #toolbar
  >
    <cds-table-toolbar-actions>
      <button cdsButton="primary" (click)="deleteDocument()">
        <span>{{
          'samenwerkfunctionaliteit.common.actions.delete' | translate
        }}</span>
        <svg size="16" class="cds--btn__icon"></svg>
      </button>
      <button cdsButton="primary" (click)="downloadDocument()">
        <span>{{
          'samenwerkfunctionaliteit.common.actions.download' | translate
        }}</span>
        <svg size="16" class="cds--btn__icon"></svg>
      </button>
    </cds-table-toolbar-actions>
    <cds-table-toolbar-content *ngIf="!toolbar.selected">
      <cds-table-toolbar-search
        [expandable]="true"
        [placeholder]="searchFieldPlaceholder"
        (valueChange)="searchValue.set($event)"
        (clear)="searchValue.set('')"
      >
      </cds-table-toolbar-search>
      <input #fileInput type="file" hidden (change)="uploadDocument($event)" />

      <button
        class="upload-button"
        cdsButton="primary"
        size="sm"
        (click)="fileInput.click()"
        [disabled]="isUploading()"
      >
        <span>{{
          'samenwerkfunctionaliteit.common.actions.upload' | translate
        }}</span>
        <svg cdsIcon="add" size="20" class="cds--btn__icon"></svg>
      </button>
    </cds-table-toolbar-content>
  </cds-table-toolbar>

  <cds-table
    [model]="model()"
    [showSelectionColumn]="showSelectionColumn"
    [skeleton]="isSkeleton()"
    [striped]="striped"
    [enableSingleSelect]="enableSingleSelect"
    (selectRow)="onRowSelected($event)"
  >
  </cds-table>
  <cds-pagination
    [model]="model()"
    (selectPage)="selectPage($event)"
    [translations]="paginationTranslations"
    [skeleton]="isSkeleton()"
    id="pagination-override-important"
  ></cds-pagination>
</cds-table-container>

<document-upload-metadata-modal
  [isUploading]="isUploading()"
  #uploadMetadataModal
></document-upload-metadata-modal>

<document-delete-modal
  #deleteModal
  [document]="selectedDocument()"
></document-delete-modal>
