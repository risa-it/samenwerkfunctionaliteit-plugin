<div class="cds-panel">
  <div class="cds-form">
    <div class="cds-field">
      <cds-label>{{ 'samenwerkfunctionaliteit.actieverzoekUpdateStatusModal.updateStatusTo' | translate }}</cds-label>
      <select class="cds--dropdown" [(ngModel)]="updateStatus">
        @for (type of allowedStatusTypes(); track $index) {
          <option [value]="type.value">{{ type.label }}</option>
        }
      </select>
    </div>

    <div class="cds-field">
      <cds-label>{{ 'samenwerkfunctionaliteit.actieverzoekUpdateStatusModal.updateStatusExplanation' | translate }}</cds-label>
      <textarea
        cdsTextArea
        id="explanation"
        [(ngModel)]="explanation"
        rows="5"
        [invalid]="hasError()"
      ></textarea>
    </div>

    <div class="cds-actions">
      <button
        cdsButton
        type="button"
        (click)="onSubmit()"
        [disabled]="isSending()"
      >
        {{ 'samenwerkfunctionaliteit.actieverzoekUpdateStatusModal.updateStatus' | translate }}
        <svg
          cdsIcon="save"
          size="16"
          class="cds--btn__icon"
        ></svg>
      </button>
    </div>
  </div>
</div>
