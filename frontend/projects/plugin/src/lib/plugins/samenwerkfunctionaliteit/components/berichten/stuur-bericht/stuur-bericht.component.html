<div class="stuur-bericht">
  <cds-textarea-label [skeleton]="isLoading()">
    <textarea
      cdsTextArea
      class="textarea-field message-body"
      [placeholder]="
        'samenwerkfunctionaliteit.messenger.messagePlaceholder' | translate
      "
      [rows]="rows"
      [maxLength]="maxLength"
      [(ngModel)]="message"
    ></textarea>
  </cds-textarea-label>

  <cds-icon-button
    [description]="'samenwerkfunctionaliteit.messenger.sendMessage' | translate"
    [disabled]="isSubmitting() || isLoading() || !message.trim()"
    (click)="onSend()"
    [showTooltipWhenDisabled]="true"
    [autoAlign]="true"
  >
    <svg cdsIcon="send" size="32" class="cds--btn__icon"></svg>
  </cds-icon-button>
</div>
