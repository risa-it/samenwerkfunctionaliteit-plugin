@if (isLightMode()) {
  @if (!isLoading()) {
    <document-table-light
      [documents]="documents()"
      [isSkeleton]="isLoading()"
    ></document-table-light>
  } @else {
    <document-table-light [isSkeleton]="isLoading()"></document-table-light>
  }
} @else {
  @if (!isLoading()) {
    <document-table
      [documents]="documents()"
      [isSkeleton]="isLoading()"
      (deleted)="onDocumentDeleted($event)"
      (uploaded)="onDocumentUploaded()"
    ></document-table>
  } @else {
    <document-table [isSkeleton]="isLoading()"></document-table>
  }
}
