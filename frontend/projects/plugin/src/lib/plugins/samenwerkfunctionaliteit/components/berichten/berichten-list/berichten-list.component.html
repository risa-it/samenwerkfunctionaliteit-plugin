<div class="messages-wrapper">
  @if (!isLoading()) {
    @for (message of sortedMessages(); track message.messageId) {
      <swf-bericht [message]="message" [oinNumber]="oinNumber()" />
    }
  } @else {
    <div class="loading-indicator">
      {{ 'samenwerkfunctionaliteit.messenger.loadingMessages' | translate }}
    </div>
  }
</div>
